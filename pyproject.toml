[project]
name = "hfx"
version = "0.0.0.dev0"
description = "A standards-first workspace for redesigning HydroFabric Exchange"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["/planning/**", "/scratchpad/**", "/.worktrees/**", "/credentials/**", "/.env", "/.env.*", "/*.env", "/*.pem", "/*.key"]
wheel-exclude = ["/src/**/.env", "/src/**/.env.*", "/src/**/*.env", "/src/**/*.pem", "/src/**/*.key", "/src/**/credentials/**", "/src/**/.worktrees/**"]

[dependency-groups]
dev = [
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.3",
    "pytest-cov>=6.2.1",
    "ruff>=0.12",
    "ty>=0.0.35",
    "uv-build>=0.12.1,<0.13",
]
raster-experiment = [
    "boto3>=1.43.109",
    "boto3-stubs[s3]>=1.43.109",
    "numpy>=2.5.3",
    "rasterio>=1.5.2",
    "rio-cogeo>=7.0.3",
    "tifffile>=2026.9.20",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "N", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N803", "N806"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
